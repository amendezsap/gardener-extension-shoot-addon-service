{{- /*
Optional image-pull secret for private extension-image registries.

Public registries leave .Values.imagePullSecret unset and
.Values.imagePullSecrets empty -- nothing renders here and the deployments carry
no imagePullSecrets, exactly as before.

Private registries set .Values.imagePullSecret.dockerconfigjson to a base64-encoded
~/.docker/config.json. The extension namespace is gardener-managed and ephemeral, so
no pre-existing secret survives a reconcile; this template renders one IN that
namespace and the deployments append its name (see _helpers image-pull-secret-name)
to their imagePullSecrets. This mirrors the gardener ecosystem convention (auditlog
etc.) of the chart owning its own registry secret rather than depending on gardenlet
to provision one.
*/ -}}
{{- if and .Values.imagePullSecret .Values.imagePullSecret.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoot-addon-service.imagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gardener-extension-shoot-addon-service
    app.kubernetes.io/instance: shoot-addon-service
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson }}
{{- end }}
